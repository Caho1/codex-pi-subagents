<style>
	@font-face { font-family: "OpenAI Sans"; src: url("/fonts/OpenAISans-Regular-c56711d328c4.woff2") format("woff2"); font-style: normal; font-weight: 400; font-display: swap; }
	@font-face { font-family: "OpenAI Sans"; src: url("/fonts/OpenAISans-Medium-7b9c963f9063.woff2") format("woff2"); font-style: normal; font-weight: 500; font-display: swap; }
	@font-face { font-family: "OpenAI Sans"; src: url("/fonts/OpenAISans-Semibold-e259229c5327.woff2") format("woff2"); font-style: normal; font-weight: 600; font-display: swap; }
	:root {
		color-scheme: light;
		--spacing: .25rem; --text-xs: 12px; --text-sm: 13px; --text-base: 14px;
		--font-weight-medium: 500; --font-weight-semibold: 600; --leading-relaxed: 1.625;
		--thread-content-max-width: 48rem; --thread-content-compact-max-width: 40rem; --thread-content-expanded-max-width: var(--thread-content-max-width);
		--thread-body-inline-padding: 24px; --codex-chat-font-size: var(--text-base); --codex-chat-code-font-size: var(--text-sm);
		--font-sans: "OpenAI Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		--font-content: "OpenAI Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --font-mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
		--composer-radius: 22px; --elevation-composer: 0 0 0 1px #0000000a, 0 2px 8px 0 #0000000a, 0 4px 80px 8px #00000006;
		--scrollbar-color: #0d0d0d1a; --alpha-04: color-mix(in oklab, #0d0d0d 4%, transparent); --alpha-08: color-mix(in oklab, #0d0d0d 8%, transparent); --codeblock-background-color: #fcfcfc; --color-background-secondary-soft-alpha: color-mix(in oklab, #0d0d0d 8%, transparent);
		--mermaid-bg: #fff;
		--color-surface: #fff; --color-surface-secondary: #f9f9f9; --color-surface-elevated: #fff; --color-surface-elevated-secondary: #fff; --color-background-composer-primary: #131313;
		--color-text: #131313; --color-text-secondary: #5d5d5d; --color-text-tertiary: #8f8f8f;
		--color-border: #0d0d0d1a; --color-border-subtle: #0d0d0d0d; --color-border-strong: #0d0d0d26;
		--color-background-primary-ghost-hover: #0000000d; --color-background-primary-soft: #ededed;
		--color-text-info: #0285ff; --link-primary-text-color: #0169cc; --color-text-danger: #fa423e;
		--color-background-user-message: color-mix(in oklab, #0d0d0d 5%, transparent);
		--control-icon-size-xs: .875rem; --control-size-2xs: 1.5rem; --radius-md: .375rem; --radius-lg: .5rem; --radius-2xl: 1rem;
		font: var(--text-base)/1.5 var(--font-sans);
	}
	@media (prefers-color-scheme: dark) {
		:root {
			color-scheme: dark;
			--color-surface: #0d0d0d; --color-surface-secondary: #131313; --color-surface-elevated: #212121; --color-surface-elevated-secondary: #212121; --color-background-composer-primary: #f3f3f3;
			--elevation-composer: inset 0 0 1px 0 #fff3;
			--scrollbar-color: #ffffff26; --alpha-04: color-mix(in oklab, #fff 10%, transparent); --alpha-08: color-mix(in oklab, #fff 8%, transparent); --codeblock-background-color: #101010; --color-background-secondary-soft-alpha: color-mix(in oklab, #fff 12%, transparent);
			--mermaid-bg: #212121;
			--color-text: #f3f3f3; --color-text-secondary: #cdcdcd; --color-text-tertiary: #8f8f8f;
			--color-border: #ffffff26; --color-border-subtle: #ffffff0d; --color-border-strong: #ffffff40;
			--color-background-primary-ghost-hover: #ffffff1a; --color-background-primary-soft: #303030;
			--color-text-info: #339cff; --link-primary-text-color: #339cff; --color-text-danger: #fa423e;
			--color-background-user-message: color-mix(in oklab, #fff 8%, transparent);
		}
	}
	/* Codex app-shared：* { scrollbar-color: var(--scrollbar-color) transparent; scrollbar-width: thin } */
	* { box-sizing: border-box; scrollbar-color: var(--scrollbar-color) transparent; scrollbar-width: thin; }
	body {
		/* PI-Desktop sidebar-preferences.ts: MIN 240 / DEFAULT 275 / MAX 520 */
		--ds-sidebar-width: 275px;
		--motion-duration-normal: 240ms; --motion-duration-fast: 160ms;
		--motion-ease-out: cubic-bezier(0, 0, 0.2, 1); --motion-ease-in: cubic-bezier(0.4, 0, 1, 1);
		margin: 0; display: flex; height: 100vh; height: 100dvh; overflow: hidden; background: var(--color-surface); color: var(--color-text);
	}
	/* PI-Desktop chrome.css @keyframes sidebar-in / sidebar-out：
	   折叠时整个 aside 卸载（is-exiting 播完动画后移除），进入时从 0 宽 + -8px 平移展开 */
	aside.sidebar { width: var(--ds-sidebar-width); flex: 0 0 var(--ds-sidebar-width); flex-direction: column; min-width: 0; max-width: 520px; height: 100%; min-height: 0; display: flex; position: relative; overflow: hidden; }
	aside.sidebar.is-entering { animation: sidebar-in var(--motion-duration-normal) var(--motion-ease-out) both; }
	aside.sidebar.is-exiting { pointer-events: none; animation: sidebar-out var(--motion-duration-fast) var(--motion-ease-in) both; }
	@keyframes sidebar-in { from { opacity: 0; flex-basis: 0; width: 0; transform: translateX(-8px); } to { opacity: 1; flex-basis: var(--ds-sidebar-width); width: var(--ds-sidebar-width); transform: translateX(0); } }
	@keyframes sidebar-out { from { opacity: 1; flex-basis: var(--ds-sidebar-width); width: var(--ds-sidebar-width); transform: translateX(0); } to { opacity: 0; flex-basis: 0; width: 0; transform: translateX(-8px); } }
	/* PI-Desktop chrome.css：动画驱动的是 dock 自身宽度，内容保持全宽由 overflow 裁切，避免逐帧重排 */
	aside.sidebar .sidebar-header, aside.sidebar #list { min-width: var(--ds-sidebar-width); }
	@media (prefers-reduced-motion: reduce) { aside.sidebar.is-entering, aside.sidebar.is-exiting { animation: none; } }
	button, input, textarea { font: inherit; }
	button { color: inherit; }
	aside { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--color-border-subtle); }
	.sidebar-header { height: 52px; flex: 0 0 52px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 4px; }
	.sidebar-header-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 2px; margin-left: auto; }
	.brand { font-size: var(--text-sm); font-weight: var(--font-weight-medium); }
	.connection { color: var(--color-text-tertiary); font-size: var(--text-xs); }
	.sidebar-toggle { width: 24px; height: 24px; flex: none; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-tertiary); cursor: pointer; }
	.sidebar-toggle:hover { background: var(--color-background-primary-ghost-hover); color: var(--color-text); }
	.sidebar-toggle svg { width: 15px; height: 15px; }
	/* PI-Desktop chrome.css：ct-lead 脱离文档流，停在标题左侧。
	   展开态滑到面板左缘外（opacity 0）；折叠态滑入 inset 处（opacity 1）。 */
	#title { --ct-lead-inset: 12px; }
	.ct-lead {
		position: absolute;
		left: calc(var(--ct-lead-inset) - 36px);
		top: 0; bottom: 0;
		display: flex; align-items: center;
		opacity: 0; pointer-events: none;
		transition: left var(--motion-duration-normal) var(--motion-ease-out), opacity var(--motion-duration-normal) var(--motion-ease-out);
	}
	#title.ct-collapsed .ct-lead {
		left: var(--ct-lead-inset);
		opacity: 1; pointer-events: auto;
		transition: left var(--motion-duration-fast) var(--motion-ease-in), opacity var(--motion-duration-fast) var(--motion-ease-in);
	}
	.ct-lead > button { flex: 0 0 28px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-tertiary); cursor: pointer; }
	.ct-lead > button:hover { background: var(--color-background-primary-ghost-hover); color: var(--color-text); }
	.ct-lead > button svg { width: 15px; height: 15px; }
	.connection.offline { color: var(--color-text-danger); }
	#list { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 12px; }
	.sidebar-footer { flex: none; padding: 8px; border-top: 1px solid var(--color-border-subtle); position: relative; }
	.model-select-label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; padding: 0 4px; color: var(--color-text-tertiary); font-size: var(--text-xs); user-select: none; }
	.model-select { width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); font-size: var(--text-sm); cursor: pointer; text-overflow: ellipsis; }
	.model-select:hover { border-color: var(--color-border-strong); }
	.model-select:focus-visible { outline: 2px solid var(--color-text-info); outline-offset: -1px; }
	.model-select:disabled { opacity: .5; cursor: default; }
	.model-select option { color: initial; background: var(--color-surface); }
	.model-select optgroup { color: var(--color-text-tertiary); font-style: normal; }
	.model-status { padding: 4px 4px 0; color: var(--color-text-danger); font-size: var(--text-xs); }
	.section + .section { margin-top: 24px; }
	.section-title { margin: 0 0 8px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; color: var(--color-text-tertiary); font-size: var(--text-sm); font-weight: 400; user-select: none; }
	.items { display: flex; flex-direction: column; gap: 4px; }
	.item { width: 100%; min-height: 40px; display: flex; align-items: flex-start; gap: 12px; padding: 8px; border: 0; border-radius: var(--radius-lg); background: transparent; text-align: left; cursor: pointer; }
	.item:hover, .item.sel { background: color-mix(in oklab, var(--color-surface-secondary) 92%, transparent); }
	.item:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--color-text-info); outline-offset: 0; }
	.avatar, .avatar picture, .avatar img { width: 24px; height: 24px; flex: none; display: block; }
	.item-main { min-width: 0; flex: 1; }
	.item-heading { min-height: 24px; display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); }
	.name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.trailing { flex: none; color: var(--color-text-tertiary); font-size: var(--text-xs); font-variant-numeric: tabular-nums; white-space: nowrap; }
	.preview { display: block; color: var(--color-text-secondary); font-size: var(--text-sm); line-height: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.section-empty { padding: 4px 8px 8px; color: var(--color-text-tertiary); font-size: var(--text-sm); }
	.show-more { margin: 8px 0 0 44px; padding: 0; border: 0; background: none; color: var(--color-text-tertiary); font-size: var(--text-xs); cursor: pointer; }
	.show-more:hover { color: var(--color-text); }

	/* Codex：主区是 app-shell-main-content 容器 */
	/* PI-Desktop chat-shell.css .main-pane：主列优先占满，最低 450px */
	main { min-width: min(450px, 100vw); min-height: 0; flex: 1; display: flex; flex-direction: column; position: relative; container: app-shell-main-content / inline-size; }
	#title { min-height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--color-border-subtle); position: relative; }
	#title.ct-collapsed { padding-left: calc(var(--ct-lead-inset) + 36px); }
	#title .detail-model { margin-left: auto; }
	.title-copy-shell { min-width: 0; flex: 1; display: flex; align-items: center; gap: 8px; }
	.title-copy { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
	.back-button { width: 24px; height: 24px; flex: none; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--color-text-secondary); cursor: pointer; }
	.back-button:hover { background: color-mix(in oklab, var(--color-surface-secondary) 92%, transparent); color: var(--color-text); }
	.detail-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-sm); font-weight: var(--font-weight-medium); }
	.detail-model { max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text-tertiary); font-size: var(--text-xs); user-select: none; }
	.title-copy-shell .detail-model { margin-left: auto; }
	.detail-placeholder { color: var(--color-text-tertiary); font-size: var(--text-sm); }
	#log { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 0 56px; }
	/* Codex transcript 容器（app-initial Wai）：全宽 + max-width = max-width + 2*padding，
	   不用 margin auto；responsive 默认 48rem，主区 < 856px 降 40rem */
	.transcript {
		--thread-content-responsive-max-width: var(--thread-content-expanded-max-width);
		width: 100%;
		max-width: calc(var(--thread-content-responsive-max-width) + var(--thread-body-inline-padding) * 2);
		margin: 0 auto;
		padding-inline: var(--thread-body-inline-padding);
	}
	@container app-shell-main-content not (width >= 53.5rem) { .transcript { --thread-content-responsive-max-width: var(--thread-content-compact-max-width, 40rem); } }
	.empty { height: 100%; display: grid; place-content: center; padding: 40px 20px; color: var(--color-text-tertiary); text-align: center; font-size: var(--text-sm); }
	.user-message { max-width: max-content; margin: 0 0 16px auto; padding: 8px 12px; border-radius: var(--radius-2xl); background: var(--color-background-user-message); white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--codex-chat-font-size); line-height: 20px; }
	.turn { margin-bottom: 16px; }
	.worked-for { width: 100%; display: flex; min-height: 0; flex-direction: column; align-items: flex-start; gap: 8px; margin: 0 0 16px; padding: 0; border: 0; background: transparent; color: var(--color-text-secondary); font-size: var(--codex-chat-font-size); text-align: left; }
	.worked-for::after { content: ""; width: 100%; border-top: 1px solid var(--color-border); }
	.worked-for-label { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
	.worked-for-label svg { width: 14px; height: 14px; }
	button.worked-for { cursor: pointer; }
	button.worked-for .chevron { transition: transform .15s; }
	button.worked-for[aria-expanded="true"] .chevron { transform: rotate(90deg); }
	.turn-tools { margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 2px; }
	.turn-tools[hidden] { display: none; }
	/* Codex agent-activity-item-row：inline-flex min-w-0 max-w-full items-center gap-1 */
	.act-head { display: inline-flex; min-width: 0; max-width: 100%; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; color: color-mix(in oklab, var(--color-text) 60%, transparent); font-size: var(--codex-chat-font-size); text-align: left; cursor: pointer; }
	.act-head > svg, .act-head > svg * { flex: none; }
	.act-head > svg { width: 16px; height: 16px; color: color-mix(in oklab, var(--color-text) 60%, transparent); }
	.act-child > svg { width: 16px; height: 16px; }
	.act-head .chevron { display: inline-flex; flex: none; width: 12px; height: 12px; color: color-mix(in oklab, var(--color-text) 60%, transparent); opacity: 0; transition: transform .3s, opacity .15s; }
	.act-head .chevron svg { width: 12px; height: 12px; }
	.act-head:hover .chevron, .act-head:focus-visible .chevron { opacity: 1; }
	.act-head[aria-expanded="true"] .chevron { transform: rotate(90deg); opacity: 1; }
	.act-head .summary { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	/* 子行：Codex --agent-activity-child-color = text/30 */
	.act-child { display: flex; align-items: flex-start; gap: 6px; padding-left: 0; color: color-mix(in oklab, var(--color-text) 30%, transparent); font-size: var(--codex-chat-font-size); }
	.act-child > svg { flex: none; width: 16px; height: 16px; margin-top: 2px; }
	.act-child .label { flex: none; }
	.act-child .value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono); font-size: .92em; }
	.act-child.error { color: var(--color-text-danger); }
	.turn-tools[hidden] + .act-child { display: none; }
	.error-message { color: var(--color-text-danger); }
	.error-message { margin-bottom: 16px; white-space: pre-wrap; }
	.assistant-message { display: flex; min-width: 0; flex-direction: column; }
	.assistant-message + .assistant-message { margin-top: 16px; }
	.markdown {
		--markdown-font-size: var(--codex-chat-font-size);
		--markdown-line-height: calc(var(--markdown-font-size) * var(--leading-relaxed));
		--markdown-space: calc(var(--markdown-font-size) / 4);
		color: var(--color-text); font-size: var(--markdown-font-size); line-height: var(--markdown-line-height); overflow-wrap: anywhere;
	}
	.markdown p { margin: 0 0 var(--markdown-space); font-family: var(--font-content); }
	.markdown > p:not(:first-child) { margin-top: calc(var(--markdown-space) * 2); }
	.markdown > p + p { margin-block: calc(var(--markdown-space) * 4); }
	.markdown p:last-child { margin-bottom: 0; }
	.markdown h1, .markdown h2, .markdown h3 { font-family: var(--font-content); font-weight: var(--font-weight-semibold); }
	.markdown h1 { margin: calc(var(--markdown-space) * 4) 0 calc(var(--markdown-space) * 2); font-size: calc(var(--markdown-font-size) * 1.5); line-height: calc(var(--markdown-space) * 8); }
	.markdown h2 { margin: calc(var(--markdown-space) * 4) 0 var(--markdown-space); font-size: calc(var(--markdown-font-size) * 1.25); line-height: calc(var(--markdown-space) * 7); }
	.markdown h3 { margin: calc(var(--markdown-space) * 4) 0 var(--markdown-space); font-size: calc(var(--markdown-font-size) * 1.125); line-height: calc(var(--markdown-space) * 7); }
	.markdown h1:first-child, .markdown h2:first-child, .markdown h3:first-child { margin-top: 0; }
	.markdown ul, .markdown ol { margin: 0; padding-inline-start: var(--markdown-line-height); list-style-position: outside; }
	.markdown li { padding-inline-start: calc(var(--markdown-space) * 1.5); }
	/* Codex _InlineCode_1gjyu_243（artifact 面板）：alpha-04 底 + 1px alpha-08 描边 */
	.markdown code { padding: 1px .3rem; border-radius: .25rem; background: var(--alpha-04); box-shadow: inset 0 0 0 1px var(--alpha-08); color: inherit; font-family: var(--font-mono); font-size: .875em; font-weight: 500; overflow-wrap: anywhere; word-break: break-word; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
	/* Codex _CodeBlock_1yxor_1 + _SyntaxHighlighter_1yxor_18（artifact 面板） */
	.markdown pre { margin: calc(var(--markdown-space) * 4) 0; position: relative; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--codeblock-background-color); overflow: hidden; }
	.markdown pre .code-copy { position: absolute; top: 0; right: 0; width: 28px; height: 28px; display: grid; place-items: center; padding: 10px 10px 0 0; box-sizing: content-box; border: 0; border-radius: inherit; background: var(--codeblock-background-color); color: var(--color-text-tertiary); cursor: pointer; opacity: 0; transition: opacity .15s; }
	.markdown pre:hover .code-copy, .markdown pre:focus-within .code-copy { opacity: 1; }
	.markdown pre .code-copy:hover { color: var(--color-text); }
	.markdown pre .code-copy svg { width: 14px; height: 14px; }
	/* Codex horizontal-scroll-fade-mask：滚动内容两端渐隐，提示可横向滚动 */
	.markdown pre .code-body {
		overflow-x: auto;
		--left-fade: 0px;
		--right-fade: 2rem;
		-webkit-mask: linear-gradient(to right, transparent 0, #000 var(--left-fade), #000 calc(100% - var(--right-fade)), transparent 100%);
		mask: linear-gradient(to right, transparent 0, #000 var(--left-fade), #000 calc(100% - var(--right-fade)), transparent 100%);
	}
	.markdown pre .code-body:not([data-overflow]) { --right-fade: 0px; -webkit-mask: none; mask: none; }
	.markdown pre .code-body:hover { scrollbar-color: var(--color-border-strong) transparent; }
	/* Codex forceCodeBlockWordWrap 默认 false：保留 pre 以维持 ASCII 图对齐，长行横向滚动 */
	.markdown pre code { display: block; margin: 0; padding: 14px 40px 14px 16px; background: none; box-shadow: none; color: var(--color-text); font-family: var(--font-mono); font-size: .875em; font-weight: 400; line-height: 1.5em; white-space: pre; }
	/* Codex _MermaidBlock_16avx_2: margin-block: markdown-space * 2 */
	.markdown .mermaid-block { margin: calc(var(--markdown-space) * 2) 0; padding: 12px; overflow-x: auto; border-radius: 24px; background: var(--color-surface); background-image: linear-gradient(var(--color-background-secondary-soft-alpha), var(--color-background-secondary-soft-alpha)); }
	.markdown .mermaid-block svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
	.markdown .mermaid-block[data-state="error"] { white-space: pre-wrap; color: var(--color-text-danger); font: var(--codex-chat-code-font-size)/1.6 var(--font-mono); }
	.markdown img { display: block; max-width: 100%; height: auto; }
	.markdown blockquote { margin: 0 0 calc(var(--markdown-space) * 2); padding: calc(var(--markdown-space) * 2) 0 calc(var(--markdown-space) * 2) calc(var(--markdown-space) * 6); position: relative; color: var(--color-text); line-height: calc(var(--markdown-space) * 6); }
	.markdown blockquote::after { content: ""; position: absolute; inset-inline-start: 0; top: calc(var(--markdown-space) * 2); bottom: calc(var(--markdown-space) * 2); width: var(--markdown-space); border-radius: calc(var(--markdown-space) / 2); background: var(--color-border-strong); }

let hydration = null;
let lastRevision = 0;
async function select(id) {

// entering/exiting 阶段驱动动画，折叠后保留节点并隐藏。
const SIDEBAR_COLLAPSED_KEY = "pi.desktop.sidebarCollapsed";

const SIDEBAR_WIDTH_MIN = 240, SIDEBAR_WIDTH_DEFAULT = 275, SIDEBAR_WIDTH_MAX = 520;
let sidebarCollapsed = localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === "true";
let sidebarPhase = "idle";
let sidebarWidth = (() => { const v = Number(localStorage.getItem(SIDEBAR_WIDTH_KEY)); return Number.isFinite(v) && v >= SIDEBAR_WIDTH_MIN ? Math.min(SIDEBAR_WIDTH_MAX, Math.round(v)) : SIDEBAR_WIDTH_DEFAULT; })();
document.documentElement.style.setProperty("--ds-sidebar-width", `${sidebarWidth}px`);
let sidebarTimer = 0;
function applySidebar() {
	const el = $("sidebar");

	el.hidden = sidebarCollapsed && !exiting;
	el.inert = sidebarCollapsed;
	el.style.display = el.hidden ? "none" : "flex";
	el.classList.toggle("is-entering", entering);
	el.classList.toggle("is-exiting", exiting);
	$("sidebar-collapse").setAttribute("aria-expanded", String(!sidebarCollapsed));
	$("sidebar-expand").setAttribute("aria-expanded", String(!sidebarCollapsed));
	const titleBar = document.getElementById("title");
	titleBar.classList.toggle("ct-collapsed", sidebarCollapsed);
	$("sidebar-lead").setAttribute("aria-hidden", sidebarCollapsed ? "false" : "true");
	$("sidebar-expand").tabIndex = sidebarCollapsed ? 0 : -1;

}
function setSidebarCollapsed(collapsed) {
	if (sidebarCollapsed === collapsed && sidebarPhase === "idle") return;
	sidebarPhase = sidebarCollapsed !== collapsed ? (collapsed ? "exiting" : "entering") : "idle";
	sidebarCollapsed = collapsed;
	localStorage.setItem(SIDEBAR_COLLAPSED_KEY, String(collapsed));
	if (sidebarPhase !== "idle") {
		// 动画结束后隐藏侧栏，保留其中的控件和事件绑定。

const toggleSidebar = () => setSidebarCollapsed(!sidebarCollapsed);
$("sidebar-collapse").innerHTML = icon("sidebarCollapse");
$("sidebar-expand").innerHTML = icon("sidebarExpand");
$("sidebar-collapse").onclick = toggleSidebar;
$("sidebar-expand").onclick = toggleSidebar;
async function loadModels() {
	const select = $("model-select");
	const status = $("model-status");

	try {
		const res = await fetch("/api/models");
		if (!res.ok) throw new Error(`HTTP ${res.status}`);
		const { models, preferred } = await res.json();
		select.innerHTML = "";
		// 按 provider 分组（保持返回顺序），option 显示真实模型名
		const groups = new Map();
		for (const m of models) {
			const provider = m.id.split("/")[0];
			if (!groups.has(provider)) groups.set(provider, []);
			groups.get(provider).push(m);
		}
		for (const [provider, list] of groups) {
			const group = document.createElement("optgroup");
			group.label = provider;
			for (const m of list) {
				const option = document.createElement("option");
				option.value = m.id;
				option.textContent = m.name;
				group.append(option);
			}
			select.append(group);
		}
		const unavailable = preferred && !models.some((m) => m.id === preferred);
		if (unavailable) {
			const option = document.createElement("option");
			option.value = preferred;
			option.textContent = `${preferred}（不可用）`;
			option.disabled = true;
			select.prepend(option);
			select.value = preferred;
